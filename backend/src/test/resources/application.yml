# Configuración SOLO para las pruebas automáticas: base de datos H2 en memoria
# (así las pruebas no dependen de tener SQL Server encendido ni internet).
spring:
  datasource:
    url: jdbc:h2:mem:restoflow_test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

restoflow:
  # El resumen del Dashboard se recalcula en cada consulta: las pruebas lo leen justo después de cobrar
  panel:
    vigencia-segundos: 0
  jwt:
    secret: clave-de-pruebas-restoflow-con-mas-de-32-caracteres
    expiracion-minutos: 60
  cors:
    origenes-permitidos: http://localhost:4200
  correo:
    modo: consola
  admin-inicial:
    nombre: Administrador Pruebas
    email: admin@pruebas.com
    contrasena: Admin2026*
  # Las pruebas nunca llaman a internet: el adaptador se prueba con un servidor simulado
  # La tarea programada de RestoFlow AI no corre en las pruebas (se prueba llamando al caso de uso)
  ia:
    alertas-programadas: false
  # En las pruebas el registro en base de datos sí está activo (se prueba); la limpieza programada no
  registro:
    limpieza-programada: false
  apis-externas:
    tiempo-espera-segundos: 1
    open-food-facts:
      url: http://localhost:9
    # Sin clave de Gemini en las pruebas (aunque el computador tenga GEMINI_API_KEY): se prueba el plan B y el
    # adaptador con un servidor simulado
    gemini:
      api-key: ""
      url: http://localhost:9

# Igual que en application.yml: Actuator con salud (liveness/readiness) e información
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    nombre: RestoFlow
    version: pruebas
