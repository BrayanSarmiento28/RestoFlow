# Configuración SOLO para las pruebas automáticas: base de datos H2 en memoria
# (así las pruebas no dependen de tener SQL Server encendido).
spring:
  datasource:
    url: jdbc:h2:mem:restoflow_test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
