# PLANTILLA. Copie este archivo como "application-local.yml" (en esta misma carpeta)
# y escriba sus datos reales. "application-local.yml" está en .gitignore: nunca se sube a GitHub.
spring:
  datasource:
    username: restoflow_app
    password: ESCRIBA_AQUI_LA_CONTRASENA_DE_SQL_SERVER
  mail:
    username: su_correo@gmail.com
    password: ESCRIBA_AQUI_LA_CONTRASENA_DE_APLICACION_DE_GOOGLE

restoflow:
  correo:
    modo: gmail   # use "consola" si no tiene Gmail configurado
  # IA externa de RestoFlow AI (Google Gemini). Clave gratuita en https://aistudio.google.com -> "Get API key".
  # Si la deja vacía, RestoFlow AI funciona con sus reglas (sin la IA externa).
  apis-externas:
    gemini:
      api-key: ESCRIBA_AQUI_LA_CLAVE_DE_GEMINI
