# ===================== PRODUCCIÓN (perfil "prod") =====================
# Sistema real del restaurante. Ningún secreto va en este archivo: todos llegan por variables
# de entorno del servidor. Si falta JWT_SECRET o ADMIN_PASSWORD, la aplicación NO arranca (a propósito).
restoflow:
  entorno: produccion
  datos-demo: false   # en producción el menú lo registra el administrador
  jwt:
    secret: ${JWT_SECRET}
  cors:
    origenes-permitidos: ${CORS_ORIGINS}
  correo:
    modo: gmail
  admin-inicial:
    contrasena: ${ADMIN_PASSWORD}

spring:
  jpa:
    hibernate:
      ddl-auto: none          # en producción las tablas se crean con el script SQL, nunca automáticamente
    show-sql: false

# Swagger apagado por defecto: en producción no se publica la documentación del API. Se puede encender con
# SWAGGER_HABILITADO=true (por ejemplo, para la sustentación); cada operación sigue exigiendo el token JWT
springdoc:
  api-docs:
    enabled: ${SWAGGER_HABILITADO:false}
  swagger-ui:
    enabled: ${SWAGGER_HABILITADO:false}
    path: /swagger-ui.html

logging:
  level:
    root: WARN
    com.udec.restoflow: INFO
    restoflow: INFO            # peticiones y auditoría siempre visibles
