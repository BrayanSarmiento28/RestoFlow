# =====================================================================
# RestoFlow · Frontend · Configuración del análisis de SonarQube
# Lo usa el escáner (sonarsource/sonar-scanner-cli en Docker) que ejecuta analizar-calidad.ps1.
# El servidor y el token NO van aquí: llegan como variables de entorno (factor III).
# =====================================================================
sonar.projectKey=restoflow-frontend
sonar.projectName=RestoFlow · Frontend
sonar.sourceEncoding=UTF-8

# Código de la aplicación (Angular + TypeScript, HTML y SCSS)
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/*.test.ts,src/environments/**

# Pruebas: *.test.ts (Jest, lógica pura) y *.spec.ts (Angular)
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Cobertura de Jest (npm run test:jest:cobertura genera coverage/jest/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/jest/lcov.info

# Archivos que solo arrancan o configuran Angular (no tienen lógica que medir con pruebas)
sonar.coverage.exclusions=src/main.ts,src/app/app-module.ts,src/app/app-routing-module.ts,src/app/app.ts
