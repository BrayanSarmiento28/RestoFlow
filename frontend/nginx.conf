# Nginx del frontend de RestoFlow
#  - Sirve la aplicación Angular (archivos estáticos)
#  - Reenvía /api al contenedor del backend: navegador → frontend → backend,
#    así el navegador ve un solo dominio y no hay problemas de CORS
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de Nginx
    server_tokens off;

    # API del backend (nombre del servicio en docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con huella en el nombre (main-ABC123.js): se pueden guardar en caché mucho tiempo
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Rutas de Angular (/login, /pedidos, /cocina...): siempre se responde index.html
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # Encabezados básicos de seguridad (Nginx no hereda add_header en los bloques
    # "location" que definen los suyos; por eso también se repiten arriba)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
