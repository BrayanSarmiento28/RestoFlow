<div class="app">
  <aside class="lateral">
    <div class="marca">
      <span class="marca__icono">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
      </span>
      <div><strong>RestoFlow</strong><small>PRO MANAGER</small></div>
    </div>

    <nav class="menu">
      @for (item of menu; track item.etiqueta) {
        @if (item.ruta) {
          <a class="item" [class.item--ai]="item.ai" [routerLink]="item.ruta" routerLinkActive="item--activo">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="item.icono"/></svg>
            {{ item.etiqueta }}
          </a>
        } @else {
          <span class="item item--pronto" [class.item--ai]="item.ai" title="Disponible en los próximos sprints">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="item.icono"/></svg>
            {{ item.etiqueta }}
            <span class="pronto">Pronto</span>
          </span>
        }
      }
    </nav>

    <div class="perfil">
      <div class="perfil__usuario">
        <span class="avatar">{{ iniciales }}</span>
        <div>
          <strong>{{ usuario?.nombre }}</strong>
          <small>{{ usuario ? nombresRol[usuario.rol] : '' }}</small>
        </div>
      </div>
      <button type="button" class="salir" (click)="salir()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="contenido">
    <router-outlet></router-outlet>
  </main>
</div>
