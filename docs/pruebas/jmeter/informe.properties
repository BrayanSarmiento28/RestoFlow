# RestoFlow · Configuración del informe HTML de JMeter (RES-56). Se usa en las tres pruebas.
# Apdex: satisfecho hasta 500 ms; tolerable hasta 3000 ms (requerimiento no funcional del proyecto).
jmeter.reportgenerator.apdex_satisfied_threshold=500
jmeter.reportgenerator.apdex_tolerated_threshold=3000
# Gráficas en el tiempo con un punto cada 10 segundos
jmeter.reportgenerator.overall_granularity=10000
jmeter.reportgenerator.report_title=RestoFlow \u00b7 pruebas de carga y estr\u00e9s
# El informe muestra solo las operaciones del restaurante (no la preparación ni la limpieza)
jmeter.reportgenerator.sample_filter=^(iniciar sesi\u00f3n|ver men\u00fa|crear pedido|cocina: en preparaci\u00f3n|cocina: listo|cocina: entregado|cobrar|pantalla cocina|lista de pedidos|mesas ocupadas|panel administrador|avisos)$
# Percentiles de la tabla: 90, 95 y 99
aggregate_rpt_pct1=90
aggregate_rpt_pct2=95
aggregate_rpt_pct3=99
# En la consola, un resumen cada 10 segundos mientras corre la prueba
summariser.name=summary
summariser.interval=10
summariser.out=true
